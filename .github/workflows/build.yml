name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: task-widget-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # One rolling release, so this link always gives the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/app-debug.apk
      - name: Publish to the latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Task Widget (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, tap app-debug.apk below to download it."
